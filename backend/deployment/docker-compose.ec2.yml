services:
  voice:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    restart: unless-stopped
    volumes:
      - caller-memory:/app/data
    expose:
      - "7860"

  caddy:
    image: caddy:2.10-alpine
    env_file:
      - ../.env
    restart: unless-stopped
    depends_on:
      voice:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caller-memory:
  caddy-data:
  caddy-config:
